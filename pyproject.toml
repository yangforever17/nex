[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nex-runtime"
version = "0.1.0"
description = "Evidence-gated execution and bounded recovery for model-authored workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "NEX contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1", "build>=1,<2"]
experiments = ["numpy>=1.24,<3", "pandas>=2,<3"]
gpu = ["torch>=2.6,<3", "transformers>=4.57,<5", "accelerate>=1,<2"]

[project.scripts]
nex = "nex.cli:main"

[project.urls]
Repository = "https://github.com/yangforever17/nex"
Issues = "https://github.com/yangforever17/nex/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"examples/migration.py" = ["F821"]

[tool.coverage.run]
source = ["nex"]
omit = ["*/experiments/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
